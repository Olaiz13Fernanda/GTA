```html
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#180d27">

    <title>GTA VI | Countdown</title>

    <!-- Hoja de estilos -->
    <link rel="stylesheet" href="estilos.css">

    <!-- JavaScript -->
    <script src="contador.js" defer></script>
</head>

<body>

    <main class="pagina">

        <!-- Capa oscura para mejorar la visibilidad -->
        <div class="velo" aria-hidden="true"></div>

        <section class="contenido">

            <!-- LOGOTIPO GTA VI -->
            <img
                class="logo"
                src="logo-gta6.png"
                alt="Grand Theft Auto VI"
            >

            <!-- ENCABEZADO -->
            <p class="ceja">
                ROCKSTAR GAMES PRESENTS
            </p>

            <h1>
                ¿LISTO PARA LA
                <span>AVENTURA, AMOR?</span>
            </h1>

            <p class="intro">
                VICE CITY NOS ESPERA...
            </p>

            <!-- CONTADOR REGRESIVO -->
            <div class="contador" role="timer">

                <div class="unidad">
                    <span class="numero" id="dias">000</span>
                    <span class="etiqueta">DÍAS</span>
                </div>

                <div class="unidad">
                    <span class="numero" id="horas">00</span>
                    <span class="etiqueta">HORAS</span>
                </div>

                <div class="unidad">
                    <span class="numero" id="minutos">00</span>
                    <span class="etiqueta">MINUTOS</span>
                </div>

                <div class="unidad">
                    <span class="numero" id="segundos">00</span>
                    <span class="etiqueta">SEGUNDOS</span>
                </div>

            </div>

            <!-- MENSAJES QUE CAMBIAN -->
            <p class="mensaje" id="mensaje">
                ¿Ya estás emocionado, amor? ♡
            </p>

            <!-- FECHA -->
            <p class="fecha">
                19 · NOVIEMBRE · 2026
            </p>

        </section>

        <!-- PIE DE PÁGINA -->
        <footer>
            MADE WITH LOVE <span>♡</span>
        </footer>

    </main>

</body>
</html>
```
